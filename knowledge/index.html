        <span>Chenyinhong</span>
      </a>

      <button class="nav-control icon-button nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav" aria-label="打开导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>

      <nav class="nav-links" id="site-nav" data-nav-menu aria-label="主导航">
        <a href="../">主页</a>
        <a href="./" aria-current="page">知识库</a>
        <a href="#leetcode">力扣</a>
        <a href="#machine-learning">机器学习</a>
        <a href="https://github.com/avengerdsf" target="_blank" rel="noreferrer noopener">GitHub</a>
        <button class="nav-control icon-button" type="button" data-theme-toggle aria-label="切换主题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.64 5.64 7.2 7.2M16.8 16.8l1.56 1.56M18.36 5.64 16.8 7.2M7.2 16.8l-1.56 1.56" />

  <main id="main">
    <section class="page-hero knowledge-page-hero">
      <div class="container reveal">
        <h1>知识库</h1>
      </div>
    </section>

    <section class="section section-tight knowledge-directory-section">
      <div class="container">
        <div class="search-panel reveal knowledge-search-panel" aria-label="知识库搜索">
          <form class="knowledge-search-form" data-knowledge-search-form role="search">
            <div class="knowledge-search-field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="11" cy="11" r="6.5" />
                <path d="m16 16 4 4" />
              </svg>
              <input class="search-input" type="search" placeholder="搜索笔记…" autocomplete="off" data-knowledge-search aria-label="搜索知识库">
              <button class="knowledge-search-submit" type="submit" data-knowledge-search-submit>搜索</button>
            </div>
          </form>
        </div>

        <div class="results-meta knowledge-results-meta">
          <span data-result-count aria-live="polite">正在生成知识索引…</span>
        </div>

        <div class="knowledge-directory" data-knowledge-grid>
          <!-- KNOWLEDGE_CONTENT -->
        </div>

        <div class="empty-state" data-empty-state>
          <h2>没有匹配内容</h2>
          <p>换一个关键词，或清除搜索条件。</p>
          <button class="button" type="button" data-reset-search>清除搜索</button>
        </div>
      </div>

  <script src="../assets/js/knowledge.js" defer></script>

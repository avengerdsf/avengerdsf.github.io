name: Validate static site

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v5

      - name: Checkout machine-learning notes
        uses: actions/checkout@v5
        with:
          repository: avengerdsf/machine-learning-notes
          path: .build/machine-learning-notes

      - name: Checkout Quartz 5
        uses: actions/checkout@v5
        with:
          repository: jackyzha0/quartz
          ref: f1fba3fc55cbf60a60a5d09c95a49c042cdab63a
          path: .build/quartz

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate source architecture
        run: node scripts/validate-site.mjs --source

      - name: Test knowledge UI and shared theme
        run: node --test knowledge-quartz/plugins/site-ui/test/*.test.mjs scripts/test/prepare-knowledge.test.mjs

      - name: Prepare Quartz workspace
        run: |
          rm -rf .build/quartz/content .build/quartz/local-plugins
          mkdir -p .build/quartz/content .build/quartz/local-plugins
          cp -R knowledge/. .build/quartz/content/
          mkdir -p .build/quartz/content/machine-learning
          rsync -a --exclude=.git --exclude=.github .build/machine-learning-notes/ .build/quartz/content/machine-learning/
          if [ -f .build/quartz/content/machine-learning/README.md ]; then
            mv .build/quartz/content/machine-learning/README.md .build/quartz/content/machine-learning/index.md
          fi
          if [ -f .build/quartz/content/machine-learning/index.md ] && ! head -n 1 .build/quartz/content/machine-learning/index.md | grep -q '^---$'; then
            { printf '%s\n' '---' 'title: 机器学习学习笔记' '---' ''; cat .build/quartz/content/machine-learning/index.md; } > .build/quartz/content/machine-learning/index.md.tmp
            mv .build/quartz/content/machine-learning/index.md.tmp .build/quartz/content/machine-learning/index.md
          fi
          node scripts/prepare-knowledge.mjs

      - name: Test and build algorithm demo plugin
        working-directory: .build/quartz/local-plugins/algorithm-demo
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

      - name: Install Quartz dependencies
        working-directory: .build/quartz
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @quartz-themes/default

      - name: Install Quartz plugins
        working-directory: .build/quartz
        run: npx quartz plugin install --from-config --concurrency 2

      - name: Build Quartz knowledge base
        working-directory: .build/quartz
        run: npx quartz build

      - name: Verify generated knowledge site
        run: |
          test -f .build/quartz/public/index.html
          TWO_SUM_PAGE="$(find .build/quartz/public/leetcode/hash-table -maxdepth 1 -type f -name 'two-sum*.html' -print -quit)"
          test -n "$TWO_SUM_PAGE"
          grep -q '两数之和' "$TWO_SUM_PAGE"
          grep -q '哈希表记录元素下标' "$TWO_SUM_PAGE"
          grep -q 'algorithm-idea-line' "$TWO_SUM_PAGE"
          grep -q 'two-sum-demo' "$TWO_SUM_PAGE"
          ! grep -q 'title: 两数之和' "$TWO_SUM_PAGE"
          ! grep -q '关系图' "$TWO_SUM_PAGE"
          ! grep -q '反向链接' "$TWO_SUM_PAGE"
          ! grep -q '指针从左向右扫描数组' "$TWO_SUM_PAGE"
          grep -R -q 'two-sum-demo__pointer' .build/quartz/public
          grep -q 'kb-overview' .build/quartz/public/index.html
          grep -q 'kb-brand' "$TWO_SUM_PAGE"
          grep -q 'kb-new-note' "$TWO_SUM_PAGE"
          grep -q 'kb-edit-link' "$TWO_SUM_PAGE"
          ! grep -q '0 个目录 · 0 篇笔记' .build/quartz/public/index.html

      - name: Render 2048px visual checkpoint
        run: |
          mkdir -p .build/preview/knowledge
          cp index.html .build/preview/
          cp -R assets .build/preview/
          cp -R .build/quartz/public/. .build/preview/knowledge/
          TWO_SUM_PAGE="$(find .build/quartz/public/leetcode/hash-table -maxdepth 1 -type f -name 'two-sum*.html' -print -quit)"
          RELATIVE_PAGE="${TWO_SUM_PAGE#.build/quartz/public/}"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .build/preview >/tmp/quartz-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS "http://127.0.0.1:4173/knowledge/" >/dev/null && break
            sleep 0.25
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=2048,1152 --screenshot="$GITHUB_WORKSPACE/.build/two-sum-visual.png" "http://127.0.0.1:4173/knowledge/$RELATIVE_PAGE"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=1440,1000 --screenshot="$GITHUB_WORKSPACE/.build/knowledge-desktop.png" "http://127.0.0.1:4173/knowledge/"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=768,1024 --screenshot="$GITHUB_WORKSPACE/.build/knowledge-tablet.png" "http://127.0.0.1:4173/knowledge/"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=390,844 --screenshot="$GITHUB_WORKSPACE/.build/knowledge-mobile.png" "http://127.0.0.1:4173/knowledge/"
          test -s .build/two-sum-visual.png
          test -s .build/knowledge-mobile.png

      - name: Upload visual checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-ui-screenshots
          path: |
            .build/two-sum-visual.png
            .build/knowledge-*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload reviewable site
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-ui-preview
          path: .build/preview
          if-no-files-found: error
          retention-days: 7

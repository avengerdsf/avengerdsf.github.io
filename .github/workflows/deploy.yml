name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v5

      - name: Checkout Quartz 5
        uses: actions/checkout@v5
        with:
          repository: jackyzha0/quartz
          ref: f1fba3fc55cbf60a60a5d09c95a49c042cdab63a
          path: .build/quartz

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate source architecture
        run: node scripts/validate-site.mjs --source

      - name: Test knowledge UI and shared theme
        run: node --test knowledge-quartz/plugins/site-ui/test/*.test.mjs scripts/test/*.test.mjs

      - name: Prepare Quartz workspace
        run: |
          node scripts/sync-knowledge.mjs
          node scripts/prepare-knowledge.mjs

      - name: Test and build algorithm demo plugin
        working-directory: .build/quartz/local-plugins/algorithm-demo
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

      - name: Install Quartz dependencies
        working-directory: .build/quartz
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @quartz-themes/default

      - name: Install Quartz plugins
        working-directory: .build/quartz
        run: node quartz/bootstrap-cli.mjs plugin install --from-config --concurrency 2

      - name: Build Quartz knowledge base
        working-directory: .build/quartz
        run: node quartz/bootstrap-cli.mjs build

      - name: Verify generated knowledge site
        run: |
          node scripts/validate-site.mjs --built

      - name: Stage static site
        run: |
          rm -rf _site
          mkdir -p _site/knowledge
          cp index.html _site/
          cp -R assets _site/
          cp -R .build/quartz/public/. _site/knowledge/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
